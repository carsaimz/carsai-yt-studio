appId: mz.carsai.ytstudio
productName: Carsai YT Studio
directories:
  output: dist-electron
# Pure-JS app: never node-gyp rebuild native deps during packaging
# (@parcel/watcher etc. have no compilers available on some runners).
npmRebuild: false
files:
  - electron/**/*
  - .next/standalone/**/*
  - .next/static/**/*
  - public/**/*
  - package.json
# asar disabled: the main process spawns the Next.js standalone server with
# ELECTRON_RUN_AS_NODE, which cannot read scripts inside an asar archive.
asar: false
artifactName: carsai-yt-studio-${version}-${os}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icon-512.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.productivity
  target:
    - dmg
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: public/icon-512.png
