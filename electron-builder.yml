appId: mz.carsai.ytstudio
productName: Carsai YT Studio
directories:
  output: dist-electron
files:
  - electron/**/*
  - .next/standalone/**/*
  - .next/static/**/*
  - public/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icon.svg
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.productivity
  target:
    - dmg
linux:
  target:
    - AppImage
    - deb
  category: Development
