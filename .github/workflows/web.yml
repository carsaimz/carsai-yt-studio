name: Web Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Mobile export check
        run: npm run build:mobile

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: .next/standalone
          retention-days: 7
