name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Web bundle + Linux Electron (AppImage, deb)
  # ------------------------------------------------------------------
  web-linux:
    name: Web + Linux build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app (standalone)
        run: bun run build

      - name: Package web bundle
        run: |
          cd .next && zip -qr ../carsai-yt-studio-${{ github.ref_name }}-web.zip standalone static ../public && cd ..
          ls -la *.zip

      - name: "Build Electron (Linux — AppImage + deb)"
        run: bunx electron-builder --config electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Collect artifacts
        run: |
          mkdir -p dist-release
          shopt -s nullglob
          for f in dist-electron/*.AppImage dist-electron/*.deb dist-electron/*.zip dist-electron/*.exe dist-electron/*.dmg; do
            cp "$f" dist-release/
          done
          ls -la dist-release/

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            carsai-yt-studio-${{ github.ref_name }}-web.zip
            dist-release/*
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Windows Electron (NSIS installer)
  # ------------------------------------------------------------------
  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app (standalone)
        run: bun run build

      - name: "Build Electron (Windows — NSIS)"
        run: bunx electron-builder --config electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist-electron/*.exe
          if-no-files-found: error

  # ------------------------------------------------------------------
  # macOS Electron (DMG)
  # ------------------------------------------------------------------
  macos:
    name: macOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app (standalone)
        run: bun run build

      - name: "Build Electron (macOS — DMG)"
        run: bunx electron-builder --config electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist-electron/*.dmg
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Android (Capacitor → Gradle → APK + AAB)
  # ------------------------------------------------------------------
  android:
    name: Android build (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static web export
        run: bun run build:mobile

      - name: Prepare native Android project
        run: bash scripts/prepare-android.sh
        env:
          CAP_SERVER_URL: ""

      - name: Build release APK + AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk \
             "carsai-yt-studio-${{ github.ref_name }}-android.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "carsai-yt-studio-${{ github.ref_name }}-android.aab"
          ls -la carsai-yt-studio-*

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            carsai-yt-studio-${{ github.ref_name }}-android.apk
            carsai-yt-studio-${{ github.ref_name }}-android.aab
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Publish GitHub Release with all artifacts + changelog notes
  # ------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [web-linux, windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist-all
          find artifacts -type f -exec cp {} dist-all/ \;
          ls -la dist-all/

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { capture=0 }
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then cp CHANGELOG.md release-notes.md; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Carsai YT Studio ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist-all/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
