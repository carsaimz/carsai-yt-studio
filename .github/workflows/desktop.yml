name: Desktop — Tauri

on:
  push:
    tags: ['v*']
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do app (ex: 1.2.0). Vazio = usa a versão actual do package.json"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      base: ${{ steps.ver.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            BASE="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            BASE="${{ github.ref_name }}"
            BASE="${BASE#v}"
          else
            BASE=$(node -p "require('./package.json').version")
          fi
          echo "base=$BASE"   >> $GITHUB_OUTPUT
          echo "tag=v$BASE"   >> $GITHUB_OUTPUT
          echo "📦 Desktop version: $BASE"

      - name: Update package.json version
        run: |
          BASE="${{ steps.ver.outputs.base }}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version='$BASE';fs.writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Commit version bump (if changed)
        run: |
          if ! git diff --quiet package.json; then
            git add package.json
            git commit -m "chore: bump version to ${{ steps.ver.outputs.base }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || git push origin HEAD:main
          fi

      - name: Ensure release exists
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Carsai YT Studio ${{ steps.ver.outputs.tag }}"
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Build Windows (.exe)
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Build web
        shell: bash
        run: BUILD_TARGET=mobile node scripts/build-web.mjs
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      - name: Ensure src-tauri
        shell: bash
        run: node scripts/ensure-tauri.mjs
      - name: Sync Tauri version
        shell: bash
        run: node scripts/sync-tauri-version.mjs ${{ needs.prepare-release.outputs.base }}
      - name: Install Tauri CLI
        run: npm install --no-save @tauri-apps/cli
      - name: Build Tauri (Windows nsis)
        run: npx tauri build --bundles nsis
      - name: Upload Windows asset to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: Build Linux (.AppImage)
    needs: prepare-release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install dependencies
        run: npm install
      - name: Build web
        shell: bash
        run: BUILD_TARGET=mobile node scripts/build-web.mjs
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      - name: Ensure src-tauri
        run: node scripts/ensure-tauri.mjs
      - name: Sync Tauri version
        run: node scripts/sync-tauri-version.mjs ${{ needs.prepare-release.outputs.base }}
      - name: Install Tauri CLI
        run: npm install --no-save @tauri-apps/cli
      - name: Build Tauri (Linux appimage)
        run: npx tauri build --bundles appimage
      - name: Upload Linux asset to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: src-tauri/target/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: Build macOS (.dmg)
    needs: prepare-release
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install dependencies
        run: npm install
      - name: Build web
        shell: bash
        run: BUILD_TARGET=mobile node scripts/build-web.mjs
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      - name: Ensure src-tauri
        run: node scripts/ensure-tauri.mjs
      - name: Sync Tauri version
        run: node scripts/sync-tauri-version.mjs ${{ needs.prepare-release.outputs.base }}
      - name: Install Tauri CLI
        run: npm install --no-save @tauri-apps/cli
      - name: Build Tauri (macOS universal dmg)
        run: npx tauri build --target universal-apple-darwin --bundles dmg
      - name: Upload macOS asset to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
