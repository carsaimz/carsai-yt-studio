<!DOCTYPE html>
<html lang="pt-BR" class="dark" style="background:#1a1410;color:#f5f0eb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1a1410" />
  <title>Carsai YT Studio</title>
  <meta name="description" content="Plataforma completa para criadores YouTube com IA." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <script>
    if (typeof Object.hasOwn !== "function") {
      Object.hasOwn = function (obj, prop) { return Object.prototype.hasOwnProperty.call(obj, prop); };
    }
    if (typeof String.prototype.replaceAll !== "function") {
      String.prototype.replaceAll = function (search, replace) { return this.split(search).join(replace); };
    }
    if (typeof globalThis.structuredClone !== "function") {
      globalThis.structuredClone = function (obj) { return JSON.parse(JSON.stringify(obj)); };
    }
    // Boot-failure diagnostics ONLY. Once React has mounted (__carsaiMounted),
    // runtime errors are handled by React's own error boundaries — this overlay
    // must NOT fire after mount, or it wipes a perfectly-alive app on any
    // benign rejected promise (e.g. an aborted fetch while typing).
    window.addEventListener("error", function (e) {
      if (!window.__carsaiMounted) window.__carsaiShowError(e.error || e.message);
    });
    window.addEventListener("unhandledrejection", function (e) {
      if (!window.__carsaiMounted) window.__carsaiShowError(e.reason);
    });
    window.__carsaiShowError = function (err) {
      if (document.getElementById("carsai-crash-screen")) return;
      var msg = err && err.stack ? err.stack : String(err);
      var el = document.createElement("div");
      el.id = "carsai-crash-screen";
      el.style.cssText = "position:fixed;inset:0;z-index:99999;background:#1a1410;color:#f5f0eb;padding:24px;font-family:monospace;font-size:13px;overflow:auto;white-space:pre-wrap;line-height:1.5";
      el.innerHTML = "<div style=\"font-family:sans-serif;font-size:18px;font-weight:700;margin-bottom:12px;color:#ff6b35\">Erro ao carregar a aplicação</div><div style=\"font-family:sans-serif;font-size:13px;color:#aaa;margin-bottom:16px\">Tire uma foto desta tela e envie ao suporte.</div><div>" + msg.replace(/</g, "&lt;") + "</div>";
      document.body.innerHTML = "";
      document.body.appendChild(el);
    };
    setTimeout(function () {
      if (!window.__carsaiMounted) window.__carsaiShowError("A aplicação não iniciou em 8 segundos.");
    }, 8000);
  </script>
</head>
<body style="margin:0;background:#1a1410">
  <div id="root"></div>
  <script type="module" src="/src/mobile/main.tsx"></script>
</body>
</html>
